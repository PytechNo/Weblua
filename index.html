    <script type="application/ld+json" data-page="landing">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Weblua",
        "url": "https://weblua.com/"
      }
    </script>
    <script type="application/ld+json" data-page="landing">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Weblua",
        "url": "https://weblua.com/",
        "description": "A free browser playground for running and sharing multi-file Lua 5.1, 5.2, 5.3, 5.4, and Luau projects through WebAssembly.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any (web browser)",
        "browserRequirements": "Requires JavaScript and WebAssembly",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "license": "https://github.com/PytechNo/Weblua/blob/main/LICENSE"
      }
    </script>
    <script type="application/ld+json" data-page="landing">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is Weblua really free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The hosted playground has no account or server-side run quota, and the source is MIT licensed. Individual runs stop after five seconds, and source links have a 32 KiB encoded-size limit."
            }
          },
          {
            "@type": "Question",
            "name": "Does my code get sent to an execution server?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Normal execution does not upload project source to an execution backend. Sharing stores source in the URL fragment. Deployments may optionally enable anonymous usage events and sanitized error reports that intentionally exclude project source."
            }
          },
          {
            "@type": "Question",
            "name": "Which Lua versions does Weblua support?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Weblua runs Lua 5.1, 5.2, 5.3, and 5.4, plus the Luau language. Luau support covers the language runtime, not Roblox APIs or the Roblox production environment."
            }
          },
          {
            "@type": "Question",
            "name": "Does Weblua type-check Luau?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Check compiles every file and reports syntax diagnostics, but it does not invoke Luau's static type analyzer."
            }
          },
          {
            "@type": "Question",
            "name": "Can I use Weblua offline?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Weblua does not currently guarantee offline startup because it has no service worker or complete PWA cache. An already loaded session can run without an execution-server round trip."
            }
          },
          {
            "@type": "Question",
            "name": "How do embeds work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Weblua generates a lazy-loading iframe whose /embed#c=2 URL contains the same source-only project payload as a share link. Sites that permit iframes can host an editable, runnable project inline."
            }
          },
          {
            "@type": "Question",
            "name": "Can I contribute?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Absolutely — Weblua is developed in the open on GitHub. Issues, feature requests, and pull requests are all welcome."
            }
          }
        ]
      }
    </script>

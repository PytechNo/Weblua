    <script type="application/ld+json" data-page="landing">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is Weblua really free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The hosted playground has no account or server-side run quota, and the source is MIT licensed. Individual runs stop after five seconds, or thirty with long runs on, and source links have a 32 KiB encoded-size limit; larger projects can be shared as a GitHub gist."
            }
          },
          {
            "@type": "Question",
            "name": "Does my code get sent to an execution server?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Normal execution does not upload project source to an execution backend. Sharing stores source in the URL fragment, and opening a #gist= link downloads that gist from GitHub's API. Deployments may optionally enable anonymous usage events and sanitized error reports that intentionally exclude project source."
            }
          },
          {
            "@type": "Question",
            "name": "Which Lua versions does Weblua support?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Weblua runs Lua 5.1, 5.2, 5.3, 5.4, and 5.5, plus the Luau language. Luau support covers the language runtime, not Roblox APIs or the Roblox production environment."
            }
          },
          {
            "@type": "Question",
            "name": "Does Weblua type-check Luau?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Luau's own type checker underlines errors as you type, and the Check action reports type errors and lints for every file. Strict mode is the default, and --!strict, --!nonstrict, and --!nocheck comments work per file. It knows the Luau standard library, not Roblox APIs. Lua 5.x projects get syntax diagnostics only."
            }
          },
          {
            "@type": "Question",
            "name": "Can I see the bytecode Luau compiles to?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. In a Luau project, the output pane's Bytecode tab lists the open file's bytecode as you edit, with optimization and debug levels from 0 to 2 and optional source lines. Runs compile at optimization level 1; a --!optimize 2 comment at the top of a file raises it for runs too."
            }
          },
          {
            "@type": "Question",
            "name": "Can I use Weblua offline?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Weblua does not currently guarantee offline startup because it has no service worker or complete PWA cache. An already loaded session can run without an execution-server round trip."
            }
          },
          {
            "@type": "Question",
            "name": "How do embeds work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Weblua generates a lazy-loading iframe whose /embed#c=2 URL contains the same source-only project payload as a share link. Sites that permit iframes can host an editable, runnable project inline."
            }
          },
          {
            "@type": "Question",
            "name": "Can I contribute?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Absolutely — Weblua is developed in the open on GitHub. Issues, feature requests, and pull requests are all welcome."
            }
          }
        ]
      }

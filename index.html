    <script type="application/ld+json" data-page="landing">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Weblua",
        "url": "https://weblua.com/"
      }
    </script>
    <script type="application/ld+json" data-page="landing">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Weblua",
        "url": "https://weblua.com/",
        "description": "A free, browser-based playground for running and sharing Lua 5.4 and Luau code, powered by WebAssembly.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any (web browser)",
        "browserRequirements": "Requires JavaScript and WebAssembly",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "license": "https://github.com/PytechNo/Weblua/blob/main/LICENSE"
      }
    </script>
    <script type="application/ld+json" data-page="landing">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is Weblua really free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The playground is free, open source (MIT), and has no usage limits. Run as much Lua as you like — it's your CPU doing the work."
            }
          },
          {
            "@type": "Question",
            "name": "Does my code get sent to a server?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Lua runs inside a WebAssembly sandbox in your browser tab, and nothing is uploaded. Even sharing keeps your code local — the snippet is compressed straight into the link's URL fragment, which browsers never send to a server."
            }
          },
          {
            "@type": "Question",
            "name": "What's the difference between Lua 5.4 and Luau?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Lua 5.4 is the latest official Lua release. Luau is Roblox's fork with gradual typing, generics, and performance-focused extensions. Weblua ships both runtimes so you can compare behavior side by side."
            }
          },
          {
            "@type": "Question",
            "name": "Can I use Weblua offline?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Once the page and runtimes are cached, execution is fully client-side — no network round trips per run. A full offline mode (PWA) is on the roadmap."
            }
          },
          {
            "@type": "Question",
            "name": "How do embeds work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Every snippet can be turned into an iframe embed. The embedded playground is fully interactive: readers can edit the code and re-run it without leaving your page."
            }
          },
          {
            "@type": "Question",
            "name": "Can I contribute?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Absolutely — Weblua is developed in the open on GitHub. Issues, feature requests, and pull requests are all welcome."
            }
          }
        ]
      }
    </script>

name: Docker image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --tag weblua:check .
      - name: Check container health and routes
        run: |
          docker run -d --name weblua -p 127.0.0.1:8080:80 weblua:check
          for _ in $(seq 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' weblua)
            [ "$status" = healthy ] && break
            sleep 1
          done
          test "$status" = healthy
          for route in / /playground /embed; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$route")
            echo "$route -> $code"
            test "$code" = 200
          done
      - name: Show container logs on failure
        if: failure()
        run: docker logs weblua
